name: release

# Собирает подписанный установщик и публикует его в GitHub Releases
# вместе с latest.json (его читает автообновление приложения).
# Запускается при пуше тега вида v1.2.3.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: ${{ github.ref_name }}
          releaseName: "NodeDeck ${{ github.ref_name }}"
          releaseBody: "Автоматическая сборка NodeDeck ${{ github.ref_name }}."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
